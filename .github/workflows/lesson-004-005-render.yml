name: Lessons 004/005 — render (split of lesson 003, 2 × ~30 min)

# New lessons 004 and 005 (production ids R04 / R05) built from the one-hour lesson 003: same Remotion project,
# same characters/boards/illustrations; voice clips reused from lessons/003/audio/clips by hash plus the new lines
# in lessons/R04|R05/audio/clips. Each chapter renders in parallel, chapters are concatenated per lesson without
# re-encoding, verified, and published as pre-releases lesson-004-preview-v1 / lesson-005-preview-v1.
# Lesson 003 files, workflow and releases are not touched.

on:
  workflow_dispatch:
  push:
    branches:
      - "claude/lesson-004-005-split"
    paths:
      - "video/src/**"
      - "lessons/R04/**"
      - "lessons/R05/**"
      - ".github/workflows/lesson-004-005-render.yml"

permissions:
  contents: write

jobs:
  check:
    # On push, render only when the commit message asks for it ("[render-split]").
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[render-split]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Timeline QA (blocked lines, audio sync, cutaway keys, 25–35 min)
        run: |
          python3 scripts/check_timeline.py
          LESSON=R04 python3 scripts/check_timeline.py
          LESSON=R05 python3 scripts/check_timeline.py

  render:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { n: "004", chapter: ch00 }
          - { n: "004", chapter: ch01 }
          - { n: "004", chapter: ch02 }
          - { n: "004", chapter: ch03 }
          - { n: "004", chapter: ch04 }
          - { n: "004", chapter: ch05 }
          - { n: "004", chapter: ch06 }
          - { n: "004", chapter: e04 }
          - { n: "005", chapter: o05 }
          - { n: "005", chapter: ch07 }
          - { n: "005", chapter: ch08 }
          - { n: "005", chapter: ch09 }
          - { n: "005", chapter: ch10 }
          - { n: "005", chapter: ch11 }
          - { n: "005", chapter: ch12 }
          - { n: "005", chapter: ch13 }
          - { n: "005", chapter: ch14 }
          - { n: "005", chapter: ch15 }
          - { n: "005", chapter: ch16 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: video/package-lock.json
      - name: Install
        working-directory: video
        run: |
          npm ci
          mkdir -p public/audio
          cp ../lessons/003/audio/clips/*.mp3 ../lessons/R04/audio/clips/*.mp3 ../lessons/R05/audio/clips/*.mp3 public/audio/
          npx remotion browser ensure
      - name: Render Lesson${{ matrix.n }}-${{ matrix.chapter }}
        working-directory: video
        run: |
          mkdir -p out
          npx remotion render src/index.ts Lesson${{ matrix.n }}-${{ matrix.chapter }} out/${{ matrix.n }}-${{ matrix.chapter }}.mp4 \
            --concurrency=4 --codec=h264 --crf=20 --jpeg-quality=85 --pixel-format=yuv420p --audio-codec=aac --log=warn
          npx remotion ffprobe -v error -show_entries format=duration:stream=codec_name,width,height,r_frame_rate -of default=nw=1 out/${{ matrix.n }}-${{ matrix.chapter }}.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: chapter-${{ matrix.n }}-${{ matrix.chapter }}
          path: video/out/${{ matrix.n }}-${{ matrix.chapter }}.mp4
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { n: "004", chapters: "ch00 ch01 ch02 ch03 ch04 ch05 ch06 e04", title: "Урок 004 — «Биз эмне үчүн жаралдык?» 1-бөлүк: Аллахты таануу жана сүйүү — preview v1" }
          - { n: "005", chapters: "o05 ch07 ch08 ch09 ch10 ch11 ch12 ch13 ch14 ch15 ch16", title: "Урок 005 — «Биз эмне үчүн жаралдык?» 2-бөлүк: кулчулук, жакшылыкта жарышуу, кыйынчылык — preview v1" }
    env:
      OUT: lesson-80-${{ matrix.n }}-full-ky-preview-v1
      TAG: lesson-${{ matrix.n }}-preview-v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: chapter-${{ matrix.n }}-*
          path: chapters
          merge-multiple: true
      - name: Concatenate chapters (no re-encoding) and verify
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          ls -la chapters
          for c in ${{ matrix.chapters }}; do echo "file '$PWD/chapters/${{ matrix.n }}-$c.mp4'"; done > concat.txt
          ffmpeg -hide_banner -loglevel error -y -f concat -safe 0 -i concat.txt -c copy -movflags +faststart "$OUT.mp4"
          ffmpeg -hide_banner -loglevel error -y -i "$OUT.mp4" -vf scale=960:540:flags=lanczos -c:v libx264 -preset fast -crf 24 \
            -pix_fmt yuv420p -c:a aac -b:a 96k -movflags +faststart "$OUT-preview-960x540.mp4"
          python3 scripts/verify_mp4.py "$OUT.mp4" --expect-min-seconds 1500 --expect-max-seconds 2100 | tee verify.txt
          n=$(ffmpeg -hide_banner -i "$OUT-preview-960x540.mp4" -vf "freezedetect=n=0.001:d=8" -map 0:v -f null - 2>&1 | grep -c "freeze_start" || true)
          echo "- frozen picture ≥8 s (freezedetect n=0.001): $n" | tee -a verify.txt
          sha256sum "$OUT.mp4" "$OUT-preview-960x540.mp4" chapters/*.mp4 | tee SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: lesson-${{ matrix.n }}-full
          path: |
            ${{ env.OUT }}.mp4
            ${{ env.OUT }}-preview-960x540.mp4
            SHA256SUMS.txt
            verify.txt
          retention-days: 30
      - name: Publish to pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "${{ matrix.title }}. Кыргызский, 1920×1080, 30 fps, H.264/AAC, без музыки."
            echo "Переработка часового урока 003 в два урока (004 + 005). Ветка ${GITHUB_REF_NAME}, коммит ${GITHUB_SHA::7}, прогон ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
            echo "Просмотровая версия: не утверждённый исламский учебный материал (см. production/lesson-004-005/HANDOFF.md, lessons/003/script/PREVIEW_REGISTER.md)."
            echo
            cat verify.txt
          } > notes.md
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "${{ matrix.title }}" --notes-file notes.md --prerelease --target "$GITHUB_SHA"
          gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --notes-file notes.md
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber "$OUT.mp4" "$OUT-preview-960x540.mp4" SHA256SUMS.txt chapters/*.mp4
          for f in "$OUT.mp4" "$OUT-preview-960x540.mp4" SHA256SUMS.txt; do
            echo "- ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/$TAG/$f" >> "$GITHUB_STEP_SUMMARY"
          done
